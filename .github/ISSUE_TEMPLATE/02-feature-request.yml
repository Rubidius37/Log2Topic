name: 기능 제안
description: 새로운 기능이나 사용성 개선 의견을 알려주세요.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        제안해 주셔서 감사합니다. 실제 연구자료 대신 가상의 예시를 사용해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 작업이 불편하거나 어려운지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방식
      description: 원하는 동작이나 화면 흐름을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 현재 사용 중인 대안
      description: 지금은 어떻게 해결하고 있는지 적어주세요. 비워도 됩니다.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 자료 확인
      options:
        - label: 제안에 연구자료, 토큰과 개인 식별정보를 포함하지 않았습니다.
          required: true
