name: 버그 제보
description: 실행 오류나 예상과 다른 동작을 알려주세요.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 실제 연구자료, 인증정보와 Notion 페이지 ID는 포함하지 마세요.
  - type: input
    id: version
    attributes:
      label: Log2Topic 버전
      description: 릴리스 이름이나 내려받은 날짜를 적어주세요.
      placeholder: 예: v1.0.0 또는 2026-08-24
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 버전
      placeholder: 예: Windows 11 x64
    validations:
      required: true
  - type: dropdown
    id: markdown_tool
    attributes:
      label: Markdown 도구
      options:
        - Obsidian
        - Visual Studio Code
        - 다른 Markdown 도구
        - 사용하지 않음
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 문제가 다시 발생하도록 실행한 작업을 순서대로 적어주세요.
      placeholder: |
        1. Log2Topic.exe 실행
        2. 트레이에서 로컬 문서 갱신 선택
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과와 오류 메시지
      description: 민감정보를 제거한 관련 오류 문장만 붙여주세요.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 자료 확인
      options:
        - label: 연구자료, 토큰, 페이지 ID와 개인 경로를 제거했습니다.
          required: true
